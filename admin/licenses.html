}
function fmtDateTime(value) {
  return value ? new Date(value).toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
}
function ago(value) {
  if (!value) return "—";
  const minutes = Math.round((Date.now() - Date.parse(value)) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours} h ago`;
  const days = Math.round(hours / 24);
  return days < 30 ? `${days} d ago` : fmtDate(value);
}
const rupees = (amount) => `₹${Number(amount || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 })}`;
const todayInput = (value) => new Date(value || Date.now()).toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });

const AVATAR_COLORS = ["#5856d6", "#0071e3", "#34aadc", "#30b0c7", "#32a852", "#ff9500", "#ff2d55", "#af52de", "#a2845e"];
function avatar(name, seed) {
  const text = String(name || "?").trim();
  const initials = text.split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase() || "?";
  let hash = 0;
  for (const char of String(seed || text)) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
  return `<span class="avatar" style="background:${AVATAR_COLORS[hash % AVATAR_COLORS.length]}">${esc(initials)}</span>`;
}

/* ---------------- Toasts ---------------- */
function toast(message, kind = "ok") {
  const element = document.createElement("div");
  element.className = `toast${kind === "error" ? " error" : ""}`;
  element.innerHTML = `${icon(kind === "error" ? "alert" : "check")}<span>${esc(message)}</span>`;
  $("#toasts").append(element);
  setTimeout(() => element.remove(), kind === "error" ? 6000 : 3200);
}

async function copyText(text, label = "Copied") {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  toast(label);
}

/* ---------------- Theme ---------------- */
function currentTheme() { return storage.get("localStorage", "swary-admin-theme") || "system"; }
function applyTheme(theme) {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
}
function cycleTheme() {
  const next = { system: "light", light: "dark", dark: "system" }[currentTheme()];
  storage.set("localStorage", "swary-admin-theme", next);
  applyTheme(next);
  renderApp();
  toast(`Theme: ${next === "system" ? "match this device" : next}`);
}
applyTheme(currentTheme());

/* ---------------- Service ---------------- */
async function api(action, body = {}) {
  let response;
  try {
    response = await fetch(state.url, {
      method: "POST",
      headers: { "content-type": "application/json", ...(state.session ? { "x-swary-admin-session": state.session.token } : {}) },
      body: JSON.stringify({ action, ...body }),
    });
  } catch {
    throw new Error("Couldn't reach the licence service. Check the Internet connection.");
  }
  const result = await response.json().catch(() => ({ error: true, message: `The service replied ${response.status}.` }));
  if (response.status === 401 && result.signedOut) {
    signOut("Your session has ended. Sign in again.");
    throw new Error(result.message);
  }
  if (!response.ok || result.error) throw new Error(result.message || `The service replied ${response.status}.`);
  return result;
}

async function refresh({ quiet = false } = {}) {
  if (!state.session) return;
  if (!quiet) renderApp();
  try {
    state.data = await api("overview");
    state.syncedAt = Date.now();
  } catch (error) {
    if (state.session) toast(error.message, "error");
  } finally {
    if (state.session) {
      renderApp();
      if (state.drawer) renderDrawer();
    }
  }
}

function signOut(message = "") {
  saveSession(null);
  state.session = null;
  state.data = null;
  state.drawer = null;
  closeModal();
  $("#drawer-layer")?.remove();
  renderSignIn(message);
}

/* ---------------- Derived data ---------------- */
function licenseFor(hash) {
  return state.data.licenses.find((license) => license.device_hash === hash && !license.revoked_at) || null;
}
function deviceFor(hash) {
  return state.data.devices.find((device) => device.device_hash === hash) || null;
}
function hotelLabel(device) {
  return device?.hotel_name || device?.device_name || (device ? `Computer ${shortId(device.device_hash)}` : "—");
}

function deviceStatus(device) {
  const license = licenseFor(device.device_hash);
  if (license) {
    const left = daysUntil(license.expires_at);
    if (left <= 0) return { key: "expired", label: "Subscription ended", tone: "danger" };
    if (left <= 30) return { key: "renewal", label: `Renewal due · ${left}d`, tone: "warning" };
    return { key: "licensed", label: "Licensed", tone: "success" };
  }
  const left = daysUntil(device.trial_ends_at);
  if (left <= 0) return { key: "trial-ended", label: "Trial ended", tone: "danger" };
  if (left <= 7) return { key: "trial-ending", label: `Trial · ${left}d left`, tone: "warning" };
  return { key: "trial", label: `Trial · ${left}d left`, tone: "info" };
}

function licenseStatus(license) {
  if (license.revoked_at) return { key: "cancelled", label: "Cancelled", tone: "neutral" };
  const left = daysUntil(license.expires_at);
  if (left <= 0) return { key: "expired", label: "Ended", tone: "danger" };
  if (left <= 30) return { key: "renewal", label: `Due · ${left}d`, tone: "warning" };
  return { key: "active", label: "Active", tone: "success" };
}

function codeStatus(code) {
  if (code.revoked_at) return { key: "cancelled", label: "Cancelled", tone: "neutral" };
  if (code.used_at) return { key: "used", label: `Used ${fmtDate(code.used_at)}`, tone: "violet" };
  return { key: "unused", label: "Unused", tone: "info" };
}

const PAYMENT_METHODS = { upi: "UPI", cash: "Cash", bank: "Bank transfer", cheque: "Cheque", card: "Card", other: "Other" };

function paymentText(code) {
  if (code.amount === null || code.amount === undefined) return "—";
  if (Number(code.amount) === 0) return "Complimentary";
  return rupees(code.amount);
}

/** Where a used code's receipt stands. */
function receiptText(code) {
  if (!code.used_at) return "";
  if (code.receipt_sent_at && code.receipt_number) return `Receipt ${code.receipt_number} · emailed ${fmtDate(code.receipt_sent_at)}`;
  return "Receipt waiting for the owner's email";
}

function receiptButtons(code) {
  if (!code.used_at) return "";
  return `<button class="btn small" data-action="receipt-pdf" data-id="${code.id}" title="Download the receipt PDF">${icon("download")} Receipt</button>
    <button class="btn small" data-action="send-receipt" data-id="${code.id}" title="Email the receipt to the owner again">${icon("mail")} Resend</button>`;
}

/** The hotel a code belongs to: the computer using its licence, else the one it was issued for. */
function codeDevice(code) {
  const license = code.license_id && state.data.licenses.find((item) => item.id === code.license_id);
  if (license?.device_hash) return deviceFor(license.device_hash);
  return code.for_device_hash ? deviceFor(code.for_device_hash) : null;
}

/** Licence moves into or out of a computer, newest first. */
function transfersFor(hash) {
  return (state.data.transfers || []).filter((item) => item.from_device_hash === hash || item.to_device_hash === hash);
}

const HOTEL_FILTERS = [
  ["all", "All", () => true],
  ["trial", "On trial", (s) => s.key === "trial" || s.key === "trial-ending"],
  ["trial-ending", "Trial ending", (s) => s.key === "trial-ending"],
  ["licensed", "Licensed", (s) => s.key === "licensed" || s.key === "renewal"],
  ["renewal", "Renewal due", (s) => s.key === "renewal"],
  ["locked", "Locked", (s) => s.key === "trial-ended" || s.key === "expired"],
];
const LICENSE_FILTERS = [
  ["all", "All", () => true],
  ["active", "Active", (s) => s.key === "active" || s.key === "renewal"],
  ["renewal", "Renewal due", (s) => s.key === "renewal"],
  ["expired", "Ended", (s) => s.key === "expired"],
  ["cancelled", "Cancelled", (s) => s.key === "cancelled"],
];
const CODE_FILTERS = [
  ["all", "All", () => true],
  ["unused", "Unused", (s) => s.key === "unused"],
  ["used", "Used", (s) => s.key === "used"],
  ["cancelled", "Cancelled", (s) => s.key === "cancelled"],
];

function matchesQuery(...values) {
  const query = state.query.trim().toLowerCase();
  return !query || values.some((value) => String(value ?? "").toLowerCase().includes(query));
}

function rowsFor(tab, filterKey = state.filter, applyQuery = true) {
  const { devices, licenses, codes } = state.data;
  if (tab === "hotels") {
    const test = (HOTEL_FILTERS.find(([key]) => key === filterKey) || HOTEL_FILTERS[0])[2];
    return devices.filter((device) => test(deviceStatus(device)) && (!applyQuery ||
      matchesQuery(device.hotel_name, device.owner_name, device.owner_email, device.owner_phone, device.device_name, shortId(device.device_hash), licenseFor(device.device_hash)?.code)));
  }
  if (tab === "licenses") {
    const test = (LICENSE_FILTERS.find(([key]) => key === filterKey) || LICENSE_FILTERS[0])[2];
    return licenses.filter((license) => {
      const device = deviceFor(license.device_hash) || {};
      return test(licenseStatus(license)) && (!applyQuery || matchesQuery(license.code, device.hotel_name, device.owner_name, device.owner_email, shortId(license.device_hash)));
    });
  }
  const test = (CODE_FILTERS.find(([key]) => key === filterKey) || CODE_FILTERS[0])[2];
  return codes.filter((code) => {
    const device = codeDevice(code) || {};
    return test(codeStatus(code)) && (!applyQuery || matchesQuery(code.code, code.note, code.kind, device.hotel_name, device.owner_name));
  });
}

      <div class="table-wrap" id="table">${renderTable(rowsFor(state.tab))}</div>
    </section>`;

  $("#search").addEventListener("input", (event) => {
    state.query = event.target.value;
    $("#table").innerHTML = renderTable(rowsFor(state.tab));
  });
}

function emptyState() {
  const filtered = state.query || state.filter !== "all";
  return `<div class="empty"><div class="glyph">${icon(filtered ? "search" : "home")}</div>
    <b>${filtered ? "Nothing matches" : state.tab === "codes" ? "No codes yet" : "No hotels yet"}</b>
    ${filtered ? "Try another search or filter." : state.tab === "codes" ? "Create one with New code." : "Computers appear here once the app checks in with the licence service."}</div>`;
}

function whatsappLink(phone, text) {
  const digits = String(phone || "").replace(/\D/g, "");
  if (digits.length < 10) return "";
  const number = digits.length === 10 ? `91${digits}` : digits;
  return `https://wa.me/${number}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}
function mailLink(email, subject, body) {
  if (!email) return "";
  return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject || "")}${body ? `&body=${encodeURIComponent(body)}` : ""}`;
}

/* ---------------- Modals ---------------- */
function closeModal() {
  $("#modal-layer")?.remove();
}

function openModal({ title, text = "", body, foot, wide = false, onMount }) {
  closeModal();
  const layer = document.createElement("div");
  layer.id = "modal-layer";
  layer.className = "modal-wrap";
  layer.innerHTML = `
    <div class="backdrop" data-action="close-modal"></div>
    <form class="modal${wide ? " wide" : ""}" role="dialog" aria-label="${esc(title)}" novalidate>
      <div class="modal-head"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}</div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${foot}</div>
    </form>`;
  document.body.append(layer);
  onMount?.($("form", layer));
  setTimeout(() => $("input:not([type=hidden]), select, textarea", layer)?.focus(), 40);
}

/** A small form; `submit` gets the form and resolves once saved. */
function formModal({ title, text, fields, submitLabel = "Save", danger = false, submit }) {
  openModal({
    title,
    text,
    body: `${fields}<div class="modal-error"></div>`,
    foot: `<button type="button" class="btn" data-action="close-modal">Back</button>
           <button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(submitLabel)}</button>`,
    onMount(form) {
      form.addEventListener("click", (event) => {
        const quick = event.target.closest("[data-quick]");
        if (!quick) return;
        $(`[name="${quick.dataset.target}"]`, form).value = quick.dataset.quick;
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = $("button[type=submit]", form);
        button.disabled = true;
        $(".modal-error", form).innerHTML = "";
        try {
          await submit(form);
          closeModal();
        } catch (error) {
          $(".modal-error", form).innerHTML = `<div class="error-note">${esc(error.message)}</div>`;
          button.disabled = false;
        }
      });
    },
  });
}

function numberField(name, label, value, quick = [], { min = 0, max = 3650, suffix = "" } = {}) {
  return `<div><label class="label" for="${name}">${esc(label)}</label>
    <div class="field"><input id="${name}" name="${name}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${esc(value)}">${suffix ? `<span class="prefix">${esc(suffix)}</span>` : ""}</div>
    ${quick.length ? `<div class="quick">${quick.map((q) => `<button type="button" class="chip" data-quick="${q}" data-target="${name}">${q}</button>`).join("")}</div>` : ""}</div>`;
}
function dateField(name, label, value) {
  return `<div><label class="label" for="${name}">${esc(label)}</label><div class="field">${icon("calendar")}<input id="${name}" name="${name}" type="date" required value="${esc(value)}"></div></div>`;
}

async function saved(promise, message) {
  await promise;
  toast(message);
  await refresh({ quiet: true });
}

function extendTrial(hash) {
  const device = deviceFor(hash);
  formModal({
    title: "Extend free trial",
    text: `${hotelLabel(device)} · ends ${fmtDate(device.trial_ends_at)}. Days are added to that date, or to today if it has passed.`,
    fields: numberField("days", "Days to add", 7, [7, 15, 30, 60], { min: 1, suffix: "days" }),
    submitLabel: "Extend trial",
    submit: (form) => saved(api("extend-trial", { deviceHash: hash, days: Number(form.days.value) }), "Trial extended"),
  });
}

function setTrialEnd(hash) {
  const device = deviceFor(hash);
  formModal({
    title: "Set trial end date",
    text: `${hotelLabel(device)}. The trial ends at the end of this day (India time). An earlier date ends it sooner.`,
    fields: dateField("date", "Trial ends on", todayInput(device.trial_ends_at)),

  });

  formModal({
    title: "Extend subscription",

    submitLabel: "Extend",
    submit: (form) => saved(api("extend-license", { licenseId: license.id, years: Number(form.years.value || 0), days: Number(form.days.value || 0) }), "Subscription extended"),
  });

function setLicenseEnd(id) {
  const license = state.data.licenses.find((item) => item.id === Number(id));
  formModal({
    title: "Set subscription end date",
    text: `${hotelLabel(deviceFor(license.device_hash))}. The subscription ends at the end of this day (India time).`,
    fields: dateField("date", "Ends on", todayInput(license.expires_at)),
    submit: (form) => saved(api("set-license-end", { licenseId: license.id, date: form.date.value }), "End date saved"),
  });
}

function transferLicense(id) {
  const license = state.data.licenses.find((item) => item.id === Number(id));
  const from = deviceFor(license.device_hash);
  const options = state.data.devices
    .filter((device) => device.device_hash !== license.device_hash)
    .sort((a, b) => hotelLabel(a).localeCompare(hotelLabel(b)))
    .map((device) => {
      const taken = !!licenseFor(device.device_hash);
      return `<option value="${esc(device.device_hash)}"${taken ? " disabled" : ""}>${esc(hotelLabel(device))} · ${shortId(device.device_hash)}${device.device_name ? ` · ${esc(device.device_name)}` : ""}${taken ? " (has a licence)" : ""}</option>`;
    });
  formModal({
    title: "Move licence to another computer",
    text: `${license.code} is on ${hotelLabel(from)} (${shortId(license.device_hash)}). It moves at once: that computer locks at its next check and the new one unlocks at its next check (or when its owner presses Check again). The end date stays the same.`,
    fields: options.length
      ? `<div><label class="label" for="target">Move to</label><div class="field"><select id="target" name="target" required>
          <option value="">Choose the new computer…</option>${options.join("")}
        </select></div>
        <p class="muted" style="margin:6px 0 0;font-size:12px">The new computer appears in this list once the app has run on it. Ask the owner for the Computer ID on its lock screen to be sure.</p></div>
        <div><label class="label" for="move-note">Reason</label><div class="field"><input id="move-note" name="note" maxlength="200" placeholder="e.g. new billing computer"></div></div>`
      : '<div class="info-note">There is no other computer yet. It appears here once the app has run on it.</div>',
    submitLabel: "Move licence",
    submit: async (form) => {
      if (!form.target?.value) throw new Error("Choose the computer to move the licence to.");
      await saved(api("transfer-license", { licenseId: license.id, deviceHash: form.target.value, note: form.note.value.trim() }), "Licence moved");
    },
  });
}

function confirmAction({ title, text, confirmLabel, run }) {
  formModal({ title, text, fields: "", submitLabel: confirmLabel, danger: true, submit: run });
}

        <div><label class="label" for="reference">Payment reference</label><div class="field"><input id="reference" name="reference" maxlength="80" placeholder="UPI / cheque no."></div></div>
        <div><label class="label" for="hotel">For hotel</label><div class="field"><select id="hotel" name="hotel">
          <option value="">Not linked yet</option>
          ${hotels.map((device) => `<option value="${esc(device.device_hash)}"${device.device_hash === presetDevice ? " selected" : ""}>${esc(hotelLabel(device))} · ${shortId(device.device_hash)}</option>`).join("")}
        </select></div></div>
      </div>
      <div><label class="label" for="note">Note</label><div class="field"><input id="note" name="note" maxlength="200" placeholder="Anything to remember about this sale"></div></div>
      <p class="muted" style="margin:0;font-size:12px">When the code is used, the owner is emailed a payment receipt (PDF) with these details. Use ₹0 for a free code; its receipt says complimentary.</p>
      <div class="modal-error"></div>`,
    foot: `<button type="button" class="btn" data-action="close-modal">Cancel</button>
           <button type="submit" class="btn primary">${icon("key")} Create code</button>`,
    onMount(form) {
      let selectedKind = kind;
      let years = "1";
      form.addEventListener("click", (event) => {
        const kindButton = event.target.closest("[data-kind]");
        if (kindButton) {
          selectedKind = kindButton.dataset.kind;
          form.querySelectorAll("#kind button").forEach((b) => b.setAttribute("aria-pressed", String(b === kindButton)));
        }
        const yearsButton = event.target.closest("[data-years]");
        if (yearsButton) {
          form.querySelectorAll("#years button").forEach((b) => b.setAttribute("aria-pressed", String(b === yearsButton)));
          years = yearsButton.dataset.years;
          $("#years-other", form).classList.toggle("hidden", years !== "other");
        }
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = $("button[type=submit]", form);
        button.disabled = true;
        $(".modal-error", form).innerHTML = "";
        try {
          if (form.amount.value === "") throw new Error("Enter the amount received (0 for a free code).");
          const { code } = await api("generate-code", {
            kind: selectedKind,
            years: years === "other" ? Number(form.yearsOther.value) : Number(years),
            amount: Number(form.amount.value),
            paymentMethod: form.method.value,
            paymentReference: form.reference.value.trim(),
            note: form.note.value.trim(),
            deviceHash: form.hotel.value || undefined,
          });
          await refresh({ quiet: true });
          showCode(code);
        } catch (error) {
          $(".modal-error", form).innerHTML = `<div class="error-note">${esc(error.message)}</div>`;
          button.disabled = false;
        }
      });
    },
  });
}

function showCode(code) {
  const device = codeDevice(code);
  const message = codeMessage(code, device);
  const subject = code.kind === "purchase" ? "Your Swary Hotel Management licence code" : "Your Swary Hotel Management renewal code";
  const wa = device && whatsappLink(device.owner_phone, message);
  const mail = device && mailLink(device.owner_email, subject, message);
  openModal({
    title: code.kind === "purchase" ? "Licence code ready" : "Renewal code ready",
    text: device ? `For ${hotelLabel(device)}.` : "Send it to the hotel owner.",
    wide: true,
    body: `
      <div class="code-hero">
        <span class="muted" style="font-size:12px;font-weight:600">${code.kind === "purchase" ? "PURCHASE" : "RENEWAL"} · ${plural(code.years, "year").toUpperCase()} · ${esc(paymentText(code).toUpperCase())}</span>
        <span class="mono">${esc(code.code)}</span>
      </div>
      <div><span class="label">Message for the owner</span><textarea class="field" rows="9" readonly id="message">${esc(message)}</textarea></div>
      <div class="share">
        <button type="button" class="btn" data-action="copy" data-text="${esc(code.code)}">${icon("copy")} Copy code</button>
        <button type="button" class="btn" data-action="copy-message">${icon("copy")} Copy message</button>
        <a class="btn" ${wa ? `href="${esc(wa)}" target="_blank" rel="noopener"` : 'aria-disabled="true" title="No phone number for this hotel"'}>${icon("chat")} WhatsApp</a>
        <a class="btn" ${mail ? `href="${esc(mail)}"` : 'aria-disabled="true" title="No email for this hotel"'}>${icon("mail")} Email</a>
      </div>`,
    foot: `<button type="button" class="btn primary" data-action="close-modal">Done</button>`,
  });
}

/* ---------------- Receipts ---------------- */
async function downloadReceipt(id) {
  try {
    const { fileName, content } = await api("receipt-pdf", { codeId: Number(id) });
    const bytes = Uint8Array.from(atob(content), (char) => char.charCodeAt(0));
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    link.download = fileName;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    await refresh({ quiet: true });
  } catch (error) {
    toast(error.message, "error");
  }
}

/* ---------------- CSV ---------------- */
function exportCsv() {
  const rows = rowsFor(state.tab);
  const quote = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
  let head;
  let lines;
  if (state.tab === "hotels") {
    head = ["Hotel", "Owner", "Email", "Phone", "Computer", "Computer ID", "Status", "Trial ends", "Licence code", "Valid until", "Version", "Last seen"];
    lines = rows.map((d) => {
      const license = licenseFor(d.device_hash);
      return [d.hotel_name, d.owner_name, d.owner_email, d.owner_phone, d.device_name, shortId(d.device_hash), deviceStatus(d).label, fmtDate(d.trial_ends_at), license?.code, license && fmtDate(license.expires_at), d.app_version, fmtDateTime(d.last_seen_at)];
    });
  } else if (state.tab === "licenses") {
    head = ["Hotel", "Computer ID", "Licence code", "Purchased", "Period (years)", "Last renewed", "Valid until", "Status"];
    lines = rows.map((l) => [hotelLabel(deviceFor(l.device_hash)), shortId(l.device_hash), l.code, fmtDate(l.purchased_at), l.period_years, fmtDate(l.last_renewed_at), fmtDate(l.expires_at), licenseStatus(l).label]);
  } else {
    head = ["Code", "Type", "Years", "Amount (INR)", "Paid by", "Reference", "Hotel", "Note", "Created", "Status", "Receipt no.", "Receipt emailed"];
    lines = rows.map((c) => [c.code, c.kind, c.years, c.amount ?? "", PAYMENT_METHODS[c.payment_method] || "", c.payment_reference, codeDevice(c) ? hotelLabel(codeDevice(c)) : "", c.note, fmtDate(c.created_at), codeStatus(c).label, c.receipt_number, c.receipt_sent_at ? fmtDate(c.receipt_sent_at) : ""]);
  }
  const csv = [head, ...lines].map((line) => line.map(quote).join(",")).join("\r\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  link.download = `swary-${state.tab}-${todayInput()}.csv`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  toast(`Exported ${plural(lines.length, "row")}`);
}

/* ---------------- Events ---------------- */
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target || target.getAttribute("aria-disabled") === "true") return;
  const { action, id, device, tab, filter, text, kind } = target.dataset;

  switch (action) {
    case "refresh": return void refresh().then(() => state.session && toast("Up to date"));
    case "theme": return cycleTheme();
    case "sign-out": return signOut("You have signed out.");
    case "tab": state.tab = tab; state.filter = "all"; return renderApp();
    case "filter": state.filter = filter; return renderApp();
    case "tile": state.tab = tab; state.filter = filter; return renderApp();
    case "export": return exportCsv();
    case "open": return openDrawer(device);
    case "close-drawer": return closeDrawer();
    case "close-modal": return closeModal();
    case "copy": return void copyText(text, "Code copied");
    case "copy-message": return void copyText($("#message").value, "Message copied");
    case "new-code": return newCode({ kind: kind || "purchase", device: device || "" });
    case "share-code": return showCode(state.data.codes.find((code) => code.id === Number(id)));
    case "receipt-pdf": return void downloadReceipt(id);
    case "send-receipt": return void api("send-receipt", { codeId: Number(id) })
      .then((result) => { toast(`Receipt ${result.number} sent to ${result.to}`); return refresh({ quiet: true }); })
      .catch((error) => toast(error.message, "error"));
    case "extend-trial": return extendTrial(device);
    case "set-trial-end": return setTrialEnd(device);
    case "extend-license": return extendLicense(id);
    case "set-license-end": return setLicenseEnd(id);
    case "transfer-license": return transferLicense(id);
    case "revoke-license": return confirmAction({
      title: "Cancel this licence?",
      text: "The computer using it locks at its next check (within a few hours, or when it next goes online). You can restore it later.",
      confirmLabel: "Cancel licence",
      run: () => saved(api("revoke-license", { licenseId: Number(id) }), "Licence cancelled"),
    });
    case "restore-license": return void saved(api("restore-license", { licenseId: Number(id) }), "Licence restored").catch((error) => toast(error.message, "error"));
    case "revoke-code": return confirmAction({
      title: "Cancel this code?",
      text: "It stops working at once. Only unused codes can be cancelled.",
      confirmLabel: "Cancel code",
      run: () => saved(api("revoke-code", { codeId: Number(id) }), "Code cancelled"),
    });
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if ($("#modal-layer")) closeModal();
  else if (state.drawer) closeDrawer();
});

// Sign out after 30 minutes without activity, or when the session ends.
for (const type of ["pointerdown", "keydown", "wheel", "touchstart"]) {
  window.addEventListener(type, () => { state.lastActivity = Date.now(); }, { passive: true });
}
setInterval(() => {
  if (!state.session) return;
  if (Date.now() - state.lastActivity > IDLE_LIMIT_MS) signOut("Signed out after 30 minutes without activity.");
  else if (Date.parse(state.session.expiresAt) <= Date.now()) signOut("Your session has ended. Sign in again.");
  else if (state.syncedAt && $("#bar .synced")) $("#bar .synced").textContent = `Updated ${ago(new Date(state.syncedAt).toISOString())}`;
}, 30000);

// Fresh numbers when coming back to the page.
window.addEventListener("focus", () => {
  if (state.session && Date.now() - state.syncedAt > 2 * 60000 && !$("#modal-layer")) void refresh({ quiet: true });
});

/* ---------------- Start ---------------- */
state.url = storage.get("localStorage", "swary-admin-url") || DEFAULT_URL;
state.session = savedSession();
if (state.session) void refresh();
else renderSignIn();
</script>
</body>
